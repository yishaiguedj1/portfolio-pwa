<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>בדיקת מקורות נתונים</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f5f5f5; margin: 0; padding: 16px; color: #222; }
  h1 { font-size: 20px; }
  p.sub { color: #666; font-size: 14px; }
  .card { background: #fff; border-radius: 12px; padding: 14px; margin: 10px 0; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .row { display: flex; gap: 10px; align-items: flex-start; }
  .badge { font-size: 22px; flex-shrink: 0; }
  .name { font-weight: bold; font-size: 15px; }
  .detail { font-size: 13px; color: #666; margin-top: 4px; word-break: break-word; }
  .ok { border-right: 5px solid #2e7d32; }
  .bad { border-right: 5px solid #c62828; }
  .run { border-right: 5px solid #f9a825; }
  #summary { font-size: 16px; font-weight: bold; }
  button { font-size: 16px; padding: 12px 24px; border-radius: 10px; border: none; background: #1565c0; color: #fff; margin-top: 8px; }
</style>
</head>
<body>
<h1>🔍 בדיקת מקורות נתונים</h1>
<p class="sub">הדף בודק מהטלפון שלך איזה מקורות מידע נגישים. בסוף יופיע סיכום — צלם מסך ושלח.</p>
<div id="summary" class="card">מריץ בדיקות…</div>
<div id="results"></div>
<button onclick="runAll()">🔄 הרץ שוב</button>

<script>
const TESTS = [
  {
    name: 'Yahoo (שרת 1) — היסטוריה יומית',
    url: 'https://query1.finance.yahoo.com/v8/finance/chart/AAPL?interval=1d&range=5d',
    json: true,
    valid: (j) => { const r = j && j.chart && j.chart.result && j.chart.result[0]; return r && r.timestamp && r.timestamp.length > 0; },
    validMsg: 'נמצאו נתוני היסטוריה'
  },
  {
    name: 'Yahoo (שרת 2) — היסטוריה יומית',
    url: 'https://query2.finance.yahoo.com/v8/finance/chart/AAPL?interval=1d&range=5d',
    json: true,
    valid: (j) => { const r = j && j.chart && j.chart.result && j.chart.result[0]; return r && r.timestamp && r.timestamp.length > 0; },
    validMsg: 'נמצאו נתוני היסטוריה'
  },
  {
    name: 'Yahoo — תוך־יומי + מסחר מורחב',
    url: 'https://query1.finance.yahoo.com/v8/finance/chart/AAPL?interval=5m&range=1d&includePrePost=true',
    json: true,
    valid: (j) => { const r = j && j.chart && j.chart.result && j.chart.result[0]; return r && r.timestamp && r.timestamp.length > 10; },
    validMsg: 'נמצאו נתונים תוך־יומיים'
  },
  {
    name: 'Stooq — היסטוריה',
    url: 'https://stooq.com/q/d/l/?s=aapl.us&i=d',
    json: false,
    valid: (t) => typeof t === 'string' && t.indexOf('Date,') === 0,
    validMsg: 'התקבל קובץ היסטוריה'
  },
  {
    name: 'Nasdaq — גרף היסטורי',
    url: 'https://api.nasdaq.com/api/quote/AAPL/chart?assetclass=stocks',
    json: true,
    valid: (j) => j && j.data && j.data.chart && j.data.chart.length > 0,
    validMsg: 'נמצאו נתוני גרף'
  },
  {
    name: 'CNBC — מחירים (בקרה, אמור לעבוד)',
    url: 'https://quote.cnbc.com/quote-html-webservice/restQuote/symbolType/symbol?symbols=NOW|META&requestMethod=quick&noform=1&partnerId=2&fund=1&exthrs=1&output=json',
    json: true,
    valid: (j) => { const f = j && j.FormattedQuoteResult && j.FormattedQuoteResult.FormattedQuote; return f && (Array.isArray(f) ? f.length : 1) > 0; },
    validMsg: 'התקבלו מחירים'
  }
];

function errName(e) {
  if (e && e.name === 'AbortError') return 'לא ענה בזמן (15 שניות)';
  if (e instanceof TypeError) return 'הדפדפן חסם את הבקשה';
  return 'שגיאה: ' + (e && e.message ? e.message : e);
}

async function runTest(t) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 15000);
  const t0 = Date.now();
  try {
    const res = await fetch(t.url, { cache: 'no-store', signal: ctrl.signal });
    const ms = Date.now() - t0;
    if (!res.ok) return { ok: false, detail: 'שגיאת שרת: ' + res.status, ms };
    const data = t.json ? await res.json() : await res.text();
    if (t.valid(data)) return { ok: true, detail: t.validMsg + ' (' + ms + 'ms)', ms };
    return { ok: false, detail: 'התקבלה תשובה אבל בלי נתונים (' + ms + 'ms)', ms };
  } catch (e) {
    return { ok: false, detail: errName(e), ms: Date.now() - t0 };
  } finally {
    clearTimeout(timer);
  }
}

async function runAll() {
  const box = document.getElementById('results');
  const sum = document.getElementById('summary');
  box.innerHTML = '';
  sum.textContent = 'מריץ בדיקות…';
  let okCount = 0;
  const cards = TESTS.map((t) => {
    const d = document.createElement('div');
    d.className = 'card run';
    d.innerHTML = '<div class="row"><div class="badge">⏳</div><div><div class="name">' + t.name + '</div><div class="detail">בודק…</div></div></div>';
    box.appendChild(d);
    return d;
  });
  for (let i = 0; i < TESTS.length; i++) {
    const r = await runTest(TESTS[i]);
    if (r.ok) okCount++;
    cards[i].className = 'card ' + (r.ok ? 'ok' : 'bad');
    cards[i].innerHTML = '<div class="row"><div class="badge">' + (r.ok ? '✅' : '❌') +
      '</div><div><div class="name">' + TESTS[i].name + '</div><div class="detail">' + r.detail + '</div></div></div>';
  }
  sum.innerHTML = 'סיכום: ' + okCount + ' מתוך ' + TESTS.length + ' מקורות עובדים ' + (okCount > 0 ? '✅' : '❌') +
    '<br><span style="font-weight:normal;font-size:14px">צלם מסך ושלח את התוצאות</span>';
}
runAll();
</script>
</body>
</html>
