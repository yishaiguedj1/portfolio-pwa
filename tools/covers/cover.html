<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face { font-family: "SNB"; src: url("NotoSansHebrew-VF.woff2") format("woff2"); font-weight: 100 900; }
html, body { margin: 0; }
.c { width: 1574px; height: 2000px; background: #6951A5; color: #fff; position: relative; overflow: hidden; font-family: "SNB", sans-serif; }
.t1, .t2, .yr, .nm { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; }
.t1 { top: 470px; font-size: 158px; font-weight: 800; letter-spacing: -1px; line-height: 1; }
.t2 { top: 668px; font-size: 128px; font-weight: 300; line-height: 1; }
.yr { top: 840px; font-size: 156px; font-weight: 800; line-height: 1; direction: ltr; }
.pt { position: absolute; left: 50%; top: 1110px; height: 660px; transform: translateX(-50%); }
.mo { position: absolute; left: 0; right: 0; top: 1150px; text-align: center; line-height: 1; }
.mo b { display: block; font-size: 300px; font-weight: 800; letter-spacing: -6px; }
.mo i { display: block; font-style: normal; font-size: 60px; font-weight: 400; margin-top: 34px; opacity: .85; }
.nm { top: 1832px; font-size: 58px; font-weight: 500; letter-spacing: 2px; line-height: 1; }
</style></head><body>
<div class="c"><div class="t1">ברקשייר האת'וויי</div><div class="t2">מכתב לבעלי המניות</div>
<div class="yr" id="yr">1987</div><img class="pt" src="portrait4.png"><div class="nm">וורן א. באפט</div></div>
<script>
/* פרמטרים: y=שנה, t1/t2/nm=טקסטים, bg/acc=צבעים, pt=קובץ הדיוקן, mo=מוטיב במקום הדיוקן (mo2=שורת משנה). בלי פרמטרים — הכריכה של באפט */
const q = new URLSearchParams(location.search);
document.getElementById('yr').textContent = q.get('y') || '1987';
if (q.get('t2')) document.querySelector('.t2').textContent = q.get('t2');
if (q.get('t1')) document.querySelector('.t1').textContent = q.get('t1');
if (q.get('nm')) document.querySelector('.nm').textContent = q.get('nm');
if (q.get('bg')) document.querySelector('.c').style.background = q.get('bg');
if (q.get('acc')) document.getElementById('yr').style.color = q.get('acc');
if (q.get('pt')) document.querySelector('.pt').src = q.get('pt');
if (q.get('mo')) {
  const mo = document.createElement('div'); mo.className = 'mo';
  const b = document.createElement('b'); b.textContent = q.get('mo'); if (q.get('acc')) b.style.color = q.get('acc');
  mo.append(b);
  if (q.get('mo2')) { const i = document.createElement('i'); i.textContent = q.get('mo2'); mo.append(i); }
  document.querySelector('.pt').replaceWith(mo);
}
</script>
</body></html>
