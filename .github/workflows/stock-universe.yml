# v239: עדכון חודשי אוטומטי של רשימת המניות לחיפוש (ibkr-proxy/lib/universe.txt) — ב־1 לכל חודש.
# מריץ את tools/stock-universe.js (Nasdaq screener + nasdaqtrader, מידע ציבורי), בודק שהחיפוש עדיין עובד
# (בדיקות השרתון), ודוחף רק אם הרשימה השתנתה. הדחיפה נוגעת ב־ibkr-proxy/ → Vercel מפרס את השרתון לבד.
name: stock-universe

on:
  schedule:
    - cron: '17 4 1 * *'   # 1 לחודש, 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/stock-universe.yml']  # הרצה ראשונה מיד כשהקובץ נוסף/משתנה

# כתיבה רק לתוכן הריפו (הקובץ של הרשימה); שאר ה־CI נשאר לקריאה בלבד
permissions:
  contents: write

concurrency:
  group: stock-universe
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: build universe
        run: node tools/stock-universe.js
      # 26/10/2026: גם רשימת שכבה 8 של הבדיקה הלילית (S&P 500 + Nasdaq-100 → ibkr-proxy/lib/xsyms.txt).
      # מקור שהשתנה (קוד 2) = הרשימה הקיימת נשארת, ושאר העדכון ממשיך
      - name: S&P 500 and Nasdaq-100 (nightly accuracy check list)
        run: |
          node tools/xsyms.js || echo "xsyms - לא עודכן (קוד $?)"
      - name: search still works (proxy tests)
        run: node ibkr-proxy/tests/run.js
      - name: commit if changed
        run: |
          if git diff --quiet -- ibkr-proxy/lib/universe.txt ibkr-proxy/lib/xsyms.txt; then
            echo "הרשימות לא השתנו"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ibkr-proxy/lib/universe.txt ibkr-proxy/lib/xsyms.txt
          git commit -m "עדכון חודשי אוטומטי: רשימת המניות לחיפוש ורשימת הבדיקה הלילית (universe.txt, xsyms.txt)"
          git push
