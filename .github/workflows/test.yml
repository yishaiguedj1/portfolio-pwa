# מריץ את כל הבדיקות בענן בכל push/PR — כדי שאפשר יהיה לעבוד מהטלפון בלי להריץ כלום מקומית.
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# אבטחה: הבדיקות רק קוראות את הקוד — בלי הרשאת כתיבה לריפו
permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: syntax check
        run: node --check app.js && node --check ibkr-proxy/api/flex-request.js
      - name: app test files
        run: |
          cd tests
          # קבצים מורשתיים מוחרגים: בודקים פונקציות/אלמנטים שהוסרו בריפקטורים
          # (buildTradesHistory, navToTwr, ibkrInceptionDate, ibkrNavHistory, ibkrPerfSums, ibkrChunks).
          # נשמרים כהיסטוריה; החייאתם = כתיבה מחדש מול הארכיטקטורה הנוכחית (warmPfHistories).
          # Legacy-excluded: these test functions/elements removed in refactors.
          SKIP="pf-v48.test.js pf-v57.test.js pf-v58.test.js pf-v59.test.js pf-v71.test.js pf-v72.test.js pf-v73.test.js pf-v75.test.js pf-v79.test.js pf-v81.test.js pf-v109.test.js ibkr-nav.test.js ibkr-perf.test.js"
          pass=0; failed=()
          for f in *.test.js; do
            case " $SKIP " in *" $f "*) echo "SKIP-legacy $f"; continue;; esac
            # v370: "|| code=$?" — תחת bash -e שורה נפרדת עצרה את הלולאה לפני שורת FAIL והיומן
            code=0; timeout 150 node "$f" > "/tmp/test-$f.log" 2>&1 || code=$?
            if [ $code -eq 0 ]; then
              pass=$((pass+1)); echo "PASS $f"
            else
              failed+=("$f"); echo "FAIL $f (exit $code)"; tail -40 "/tmp/test-$f.log"
            fi
          done
          echo "---- $pass passed, ${#failed[@]} failed ----"
          [ ${#failed[@]} -eq 0 ]
      - name: proxy tests
        run: node ibkr-proxy/tests/run.js

  # v358: העובד בענן של סטודיו התרגום (translator/vt) — Python. ספריות הליבה בלבד (בלי מנועי התמלול/היישור הכבדים)
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: core deps
        run: python3 -m venv /tmp/vtv && /tmp/vtv/bin/pip install --quiet -r translator/vt-requirements.txt
      - name: vt + worker tests
        working-directory: translator
        run: /tmp/vtv/bin/python -m unittest discover -s tests

  # כללי הגישה ל־Firestore (firestore/firestore.rules) מול האמולטור הרשמי — כל משתמש רק את המסמך שלו, השאר רק השרתון
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - name: install (נעול — package-lock.json)
        working-directory: firestore
        run: npm ci --no-audit --no-fund
      - name: rules tests
        working-directory: firestore
        run: npm test
