# THE SNOWBALL — בניית אפליקציות האנדרואיד (APK) ופרסום בקישורים קבועים.
# 14/10/2026: שלוש אפליקציות נפרדות (flavors ב־android/app/build.gradle.kts) — כל אחת בקישור קבוע משלה:
#   https://github.com/yishaiguedj1/portfolio-pwa/releases/download/android-latest/the-snowball.apk          (Invest — הקישור הישן)
#   https://github.com/yishaiguedj1/portfolio-pwa/releases/download/android-latest/the-snowball-academy.apk
#   https://github.com/yishaiguedj1/portfolio-pwa/releases/download/android-latest/the-snowball-studio.apk
#   https://github.com/yishaiguedj1/portfolio-pwa/releases/download/android-latest/the-snowball-bubble.apk   (22/10/2026: הבועה בדפדפן — נפרדת, כי Play Protect חוסם שירות נגישות)
#   https://github.com/yishaiguedj1/portfolio-pwa/releases/download/android-latest/the-snowball-admin.apk     (22/10/2026: ממשק הניהול + ווידג׳ט הניטור)
#   https://github.com/yishaiguedj1/portfolio-pwa/releases/download/android-latest/the-snowball-studio-dm.apk (23/10/2026: Studio DM — מנהל הורדות נייטיב)
#   https://github.com/yishaiguedj1/portfolio-pwa/releases/download/android-latest/the-snowball-browser.apk  (26/10/2026: Studio Browser — הדפדפן)
#   https://github.com/yishaiguedj1/portfolio-pwa/releases/download/android-latest/the-snowball-lab.apk       (24/10/2026: Studio Lab — כלי המדידה של התרגום בטלפון)
#   https://github.com/yishaiguedj1/portfolio-pwa/releases/download/android-latest/studio-browser-chrome.zip  (26/10/2026: התוסף ל־Chrome — סנכרון עם Studio Browser)
# רץ רק כשמשהו ב־android/ משתנה (או ידנית).
# חתימה: הסוד SNOWBALL_KEYSTORE_B64 (+ SNOWBALL_KS_PASS). בלי הסוד — בונה עם מפתח debug ומעלה רק כ־artifact
# (לא לקישור הקבוע), כי APK עם מפתח אחר לא מתקין את עצמו מעל הגרסה הקודמת.
name: android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  # שלב 4: גם ב־PR — שגיאת קומפילציה נתפסת לפני המיזוג. ב־PR: בלי מפתח החתימה ובלי פרסום (רק בנייה)
  pull_request:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write # פרסום ה־APK ב־Release (רק ה־workflow הזה; test.yml נשאר read)

concurrency:
  group: android-${{ github.ref }}    # PR לא מבטל בנייה של main (ולהפך)
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # הבנייה (Gradle) מריצה קוד מהריפו — בלי טוקן כתיבה שמור ב־.git
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '8.14.3'
      - name: Android SDK 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Keystore
        id: ks
        if: github.event_name != 'pull_request'
        env:
          KS_B64: ${{ secrets.SNOWBALL_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/snowball.keystore"
            echo "SNOWBALL_KEYSTORE=$RUNNER_TEMP/snowball.keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::חסר הסוד SNOWBALL_KEYSTORE_B64 — בנייה עם מפתח debug, בלי פרסום לקישור הקבוע"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build APK
        working-directory: android
        env:
          SNOWBALL_KS_PASS: ${{ secrets.SNOWBALL_KS_PASS }}
          SNOWBALL_VERSION_CODE: ${{ github.run_number }}
          SNOWBALL_VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle --no-daemon assembleRelease testStudioReleaseUnitTest testBubbleReleaseUnitTest testDmReleaseUnitTest testLabReleaseUnitTest testBrowserReleaseUnitTest
      - name: Rename
        run: |
          cp android/app/build/outputs/apk/invest/release/app-invest-release.apk the-snowball.apk
          cp android/app/build/outputs/apk/academy/release/app-academy-release.apk the-snowball-academy.apk
          cp android/app/build/outputs/apk/studio/release/app-studio-release.apk the-snowball-studio.apk
          cp android/app/build/outputs/apk/bubble/release/app-bubble-release.apk the-snowball-bubble.apk
          cp android/app/build/outputs/apk/admin/release/app-admin-release.apk the-snowball-admin.apk
          cp android/app/build/outputs/apk/dm/release/app-dm-release.apk the-snowball-studio-dm.apk
          cp android/app/build/outputs/apk/lab/release/app-lab-release.apk the-snowball-lab.apk
          cp android/app/build/outputs/apk/browser/release/app-browser-release.apk the-snowball-browser.apk
          # התוסף ל־Chrome (סנכרון עם Studio Browser) — קובץ להתקנה במצב מפתח, עד שיעלה לחנות
          (cd android/chrome-ext && zip -qr ../../studio-browser-chrome.zip . -x "*.md")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: the-snowball-apk
          path: the-snowball*.apk
          retention-days: 14
      - name: Publish (android-latest)
        if: github.event_name != 'pull_request' && steps.ks.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view android-latest > /dev/null 2>&1; then
            gh release create android-latest --title "THE SNOWBALL — אנדרואיד" --notes "הגרסה האחרונה של אפליקציית האנדרואיד. הקישור להורדה קבוע." --latest=false
          fi
          gh release upload android-latest the-snowball.apk the-snowball-academy.apk the-snowball-studio.apk the-snowball-bubble.apk the-snowball-admin.apk the-snowball-studio-dm.apk the-snowball-lab.apk the-snowball-browser.apk studio-browser-chrome.zip --clobber
          gh release edit android-latest --notes "הגרסה האחרונה: 1.0.${{ github.run_number }} (${GITHUB_SHA::7})"
