# פס פריסה אחד (12/10/2026): אחרי כל מיזוג ל־main — מחכים ש־GitHub Pages יגיש את הגרסה החדשה,
# בודקים שכל קובץ באתר החי זהה לטביעה שב־sw.js (tools/swgen.js --live), ורק אז מוסיפים תגית git לגרסה
# (vNNN = נקודת חזרה ידועה). ריצה אדומה = האתר החי לא תואם — סימן אמיתי, לא רעש.
# שינוי שלא מעלה גרסה (מסמכים, שרתון) — רק אימות, בלי תגית חדשה.
name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write   # רק בשביל התגית
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  verify-and-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: מחכים שהגרסה תעלה לאתר החי
        id: wait
        run: |
          ver=$(grep -oP "const APP_VERSION = '\Kv\d+" app.js)
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 40); do
            live=$(curl -sS --max-time 20 "https://yishaiguedj1.github.io/portfolio-pwa/sw.js?n=$RANDOM$i" | grep -oP "portfolio-pwa-\Kv\d+" | head -1 || true)
            if [ "$live" = "$ver" ]; then echo "האתר החי על $ver"; exit 0; fi
            echo "עדיין $live — מחכים ($i)"; sleep 30
          done
          echo "::error::האתר החי לא הגיע ל־$ver תוך 20 דקות"; exit 1
      - name: אימות כל הקבצים מול הטביעות
        run: |
          for i in 1 2 3; do
            if node tools/swgen.js --live https://yishaiguedj1.github.io/portfolio-pwa/; then exit 0; fi
            echo "ניסיון $i לא תאם — מחכים דקה (CDN)"; sleep 60
          done
          exit 1
      - name: תגית לגרסה
        env:
          VER: ${{ steps.wait.outputs.ver }}
        run: |
          if git rev-parse -q --verify "refs/tags/$VER" >/dev/null; then echo "התגית $VER כבר קיימת"; exit 0; fi
          git tag "$VER" "$GITHUB_SHA"
          git push origin "refs/tags/$VER"
          echo "נוספה תגית $VER"
