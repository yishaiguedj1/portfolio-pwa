# "הקמת שרת" — מחוץ לשרת (שלב 2ב, 12/10/2026; תוכנית העמידות: מה שמקים את השרת לא חי עליו).
#
# Actions ← server ← Run workflow. רץ רק אחרי אישור שלך (Environment "production" — אותו אישור של הפריסה).
#   1. טוקן שרת חדש לכל סביבה נרשם ב־Firestore שלה (חשבון השירות) — בלי השרתון, שעוד לא קיים.
#   2. קוד ההקמה מהריפו + קובצי הסודות של החדרים, מ־GitHub Secrets (לא מודפסים, לא נשמרים).
#   3. השרת נוצר ב־Hetzner עם חומת האש snb-closed (בלי אף כלל נכנס). שם קיים = עוצרים, לא דורסים.
#   4. מחכים שהשרתונים יענו דרך ה־Tunnel ושהעובדים יתחברו.
# מה מקימים:
#   stg — הניסוי בלבד: ה־Tunnel, השרתון והעובד של הניסוי (ברירת מחדל: snb-stg-1, ‏cax21).
#   all — שרת אחד לכל המערכת: גם העובד של הייצור (ברירת מחדל: snb-1, ‏cax31 — 16GB, $24.99 לחודש לפי המסוף; אושר 12/10/2026).
# החשבון מחויב בדולרים — המחיר הקובע הוא זה שבמסוף של Hetzner (לא טבלת היורו באתר). סוג אחר = מחיר אחר — לבדוק לפני (CLAUDE.md, סעיף 10).
#         דורש גם PROD_FIREBASE_SA ו־PROD_ANTHROPIC_KEY.
#         ת3: גם השרתון של הייצור (api.thesnowball.app, Tunnel משלו — PROD_TUNNEL_TOKEN). הסודות שלו נקראים מ־Vercel
#         (VERCEL_TOKEN; שם הפרויקט במשתנה VERCEL_PROJECT, ברירת מחדל ibkr-proxy). משתנה Sensitive — ב־PROD_APP_EXTRA.
#         שרת קיים לא מקבל חדרים חדשים: מקימים שרת בשם חדש (למשל snb-2), בודקים, ומוחקים את הישן.
# הסודות — infra/README.md, "שרת הניסוי" ו"שרת אחד לכל המערכת".
name: server

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'מה להקים — stg: הניסוי בלבד · all: שרת אחד לייצור ולניסוי'
        type: choice
        options: [stg, all]
        default: stg
      name:
        description: 'שם השרת ב־Hetzner (ריק = snb-stg-1 / snb-1; שם קיים = עצירה — לשרת חדש שם חדש, למשל snb-2)'
        default: ''
      type:
        description: 'סוג (ריק = cax21 לניסוי / cax31 לשרת המאוחד, $24.99 לחודש). סוג אחר — לבדוק את המחיר במסוף לפני'
        default: ''
      location:
        description: 'מיקום (nbg1 / fsn1 / hel1)'
        default: nbg1

permissions: {}

concurrency:
  group: server
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 80
    permissions:
      contents: read
    env:
      PLAN: ${{ inputs.env }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: שם וסוג
        id: def
        env:
          NAME_IN: ${{ inputs.name }}
          TYPE_IN: ${{ inputs.type }}
        run: |
          set -eu
          node tools/server-provision.js defaults --plan "$PLAN" --name "$NAME_IN" --type "$TYPE_IN" | sed 's/^✓ //' >> "$GITHUB_OUTPUT"
      - name: טוקן שרת לניסוי — נרשם ב־Firestore של הניסוי
        id: reg
        env:
          STG_FIREBASE_SA: ${{ secrets.STG_FIREBASE_SA }}
          NAME: ${{ steps.def.outputs.name }}
        run: |
          set -eu
          out=$(node tools/server-provision.js register --env stg --plan "$PLAN" --name "$NAME" --out "$RUNNER_TEMP/tok")
          echo "$out"
          echo "sid=${out#*sid=}" >> "$GITHUB_OUTPUT"
      - name: טוקן שרת לייצור — נרשם ב־Firestore של הייצור
        id: regp
        if: inputs.env == 'all'
        env:
          PROD_FIREBASE_SA: ${{ secrets.PROD_FIREBASE_SA }}
          NAME: ${{ steps.def.outputs.name }}
        run: |
          set -eu
          out=$(node tools/server-provision.js register --env prod --plan "$PLAN" --name "$NAME" --out "$RUNNER_TEMP/tokp")
          echo "$out"
          echo "sid=${out#*sid=}" >> "$GITHUB_OUTPUT"
      - name: קוד ההקמה עם הסודות
        env:
          STG_FIREBASE_SA: ${{ secrets.STG_FIREBASE_SA }}
          STG_TUNNEL_TOKEN: ${{ secrets.STG_TUNNEL_TOKEN }}
          STG_R2_ACCESS_KEY_ID: ${{ secrets.STG_R2_ACCESS_KEY_ID }}
          STG_R2_SECRET_ACCESS_KEY: ${{ secrets.STG_R2_SECRET_ACCESS_KEY }}
          STG_ANTHROPIC_KEY: ${{ secrets.STG_ANTHROPIC_KEY }}
          STG_ADMIN_EMAIL: ${{ secrets.STG_ADMIN_EMAIL }}
          PROD_ANTHROPIC_KEY: ${{ secrets.PROD_ANTHROPIC_KEY }}
          PROD_TUNNEL_TOKEN: ${{ secrets.PROD_TUNNEL_TOKEN }}
          PROD_APP_EXTRA: ${{ secrets.PROD_APP_EXTRA }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT: ${{ vars.VERCEL_PROJECT }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/server-provision.js cloud-init --plan "$PLAN" --token "$RUNNER_TEMP/tok" --token-prod "$RUNNER_TEMP/tokp" --out "$RUNNER_TEMP/ud"
      - name: יצירת השרת ב־Hetzner
        id: create
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          NAME: ${{ steps.def.outputs.name }}
          TYPE: ${{ steps.def.outputs.type }}
          LOC: ${{ inputs.location }}
        run: |
          set -eu
          node tools/server-provision.js create --plan "$PLAN" --name "$NAME" --type "$TYPE" --location "$LOC" --user-data "$RUNNER_TEMP/ud"
          rm -f "$RUNNER_TEMP/ud" "$RUNNER_TEMP/tok" "$RUNNER_TEMP/tokp"
      - name: מחכים — השרתון של הניסוי דרך ה־Tunnel, ואז העובד שלו
        env:
          STG_FIREBASE_SA: ${{ secrets.STG_FIREBASE_SA }}
          SID: ${{ steps.reg.outputs.sid }}
        run: |
          node tools/server-provision.js wait --env stg --sid "$SID"
          echo "✓ הניסוי: השרת $SID מחובר" >> "$GITHUB_STEP_SUMMARY"
      - name: מחכים — השרתון של הייצור (api.thesnowball.app), ואז העובד שלו
        if: inputs.env == 'all'
        env:
          PROD_FIREBASE_SA: ${{ secrets.PROD_FIREBASE_SA }}
          SID: ${{ steps.regp.outputs.sid }}
        run: |
          node tools/server-provision.js wait --env prod --sid "$SID"
          echo "✓ הייצור: השרתון עונה ב־api.thesnowball.app והשרת $SID מחובר — אפשר להסיר את השרת הישן במסך השרת באפליקציה" >> "$GITHUB_STEP_SUMMARY"
      - name: ניקוי — השרת לא נוצר, הרישום של הניסוי נמחק
        if: failure() && steps.reg.outputs.sid != '' && steps.create.outcome != 'success'
        env:
          STG_FIREBASE_SA: ${{ secrets.STG_FIREBASE_SA }}
          SID: ${{ steps.reg.outputs.sid }}
        run: node tools/server-provision.js unregister --env stg --sid "$SID"
      - name: ניקוי — השרת לא נוצר, הרישום של הייצור נמחק
        if: failure() && steps.regp.outputs.sid != '' && steps.create.outcome != 'success'
        env:
          PROD_FIREBASE_SA: ${{ secrets.PROD_FIREBASE_SA }}
          SID: ${{ steps.regp.outputs.sid }}
        run: node tools/server-provision.js unregister --env prod --sid "$SID"
      - name: מחיקת הקבצים הזמניים
        if: always()
        run: rm -f "$RUNNER_TEMP/ud" "$RUNNER_TEMP/tok" "$RUNNER_TEMP/tokp"
