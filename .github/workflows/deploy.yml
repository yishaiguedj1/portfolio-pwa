# פס הפריסה (שלב 2 בסביבות, 12/10/2026): מיזוג ל־main → סביבת הניסוי → האתר החי, רק באישור שלך.
#  1. הבדיקות (tests) עוברות על main. בלי בדיקות ירוקות — שום דבר לא עולה (עד היום Pages עלה גם כשהבדיקות נכשלו).
#  2. staging: אותו קומיט עולה ל־Cloudflare Pages (הפרויקט thesnowball, Direct Upload עם wrangler — לא החיבור
#     ל־Git של Cloudflare: ככה רק קומיט שהבדיקות שלו ירוקות מגיע לניסוי), ואז כל קובץ שם נבדק מול הטביעות שב־sw.js
#     (tools/swgen.js --live). בלי הסוד CLOUDFLARE_API_TOKEN — מדלגים על הניסוי. הכתובת: STAGING_URL, אחרת thesnowball.pages.dev.
#  3. approve: רק כש־APP_RELEASE עלה (גרסה X.Y.Z שעוד אין לה תגית) — אחרת השינוי נשאר בניסוי ויעלה עם הגרסה הבאה.
#     הסביבה production ב־GitHub מחכה לאישור שלך ("Review deployments" בטלפון). שחרור חדש לפני האישור
#     מבטל את ההמתנה הקודמת — תמיד מאשרים את האחרון, שכולל את כל מה שלפניו.
#  4. deploy: אותם קבצים בדיוק (אותו קומיט) ל־GitHub Pages. דורש בהגדרות: Pages → Source = GitHub Actions.
#     deploy-cf (שלב 5, 14/10/2026): ובמקביל לפרויקט הייצור ב־Cloudflare Pages ‏(thesnowball-prod) —
#     invest/academy/studio.thesnowball.app. github.io ממשיך לקבל את אותה בנייה (קישורים ישנים, APK ישן).
#  5. verify-and-tag: האתר החי מגיש את הבנייה (בשתי הכתובות), כל קובץ זהה לטביעה, ותגית git ‏vX.Y.Z (גרסת המערכת) = נקודת חזרה.
# חזרה לגרסה קודמת = התוכן של התגית הקודמת כגרסה חדשה (CLAUDE.md סעיף 8). Run workflow ידני = פריסה חוזרת של הראשי.
name: deploy
on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
jobs:
  staging:
    # רק קומיט שנדחף ל־main בריפו הזה (לא PR, לא fork). בנוסף, למטה: הקומיט חייב להיות בהיסטוריה של main
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      ver: ${{ steps.ver.outputs.ver }}
      rel: ${{ steps.ver.outputs.rel }}
      release: ${{ steps.ver.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: הקומיט נמצא ב־main — ורק אז עוברים אליו
        run: |
          git merge-base --is-ancestor "$SHA" HEAD || { echo "::error::$SHA לא נמצא ב־main — לא פורסים"; exit 1; }
          git checkout -q --detach "$SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: הבנייה, גרסת המערכת, והאם זו גרסה חדשה
        id: ver
        run: |
          rel=$(grep -oP "const APP_RELEASE = '\K\d+\.\d+\.\d+" app.js)
          echo "ver=$(grep -oP "const APP_VERSION = '\Kv\d+" app.js)" >> "$GITHUB_OUTPUT"
          echo "rel=$rel" >> "$GITHUB_OUTPUT"
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$rel")" ]; then
            echo "release=no" >> "$GITHUB_OUTPUT"; echo "‏$rel כבר באתר החי — השינוי נשאר בניסוי ויעלה עם הגרסה הבאה"
          else
            echo "release=yes" >> "$GITHUB_OUTPUT"; echo "גרסה חדשה: $rel — ממתין לאישור לפרודקשן"
          fi
      - name: העלאה לסביבת הניסוי (Cloudflare Pages)
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          REL: ${{ steps.ver.outputs.rel }}
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "אין CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID — מדלגים על הניסוי"; exit 0; fi
          W="npx --yes wrangler@4.140.0"
          # רק הקבצים שב־git (בלי .git ובלי .github) — אותו תוכן ש־Pages מפרסם
          site="$RUNNER_TEMP/site"; mkdir -p "$site"
          git archive "$SHA" | tar -x -C "$site"; rm -rf "$site/.github"
          $W pages project list | grep -q ' thesnowball ' || $W pages project create thesnowball --production-branch main
          $W pages deploy "$site" --project-name thesnowball --branch main --commit-hash "$SHA" --commit-message "$REL ($VER)" --commit-dirty=true
          echo "up=yes" >> "$GITHUB_OUTPUT"
      - name: סביבת הניסוי מגישה את הגרסה, וכל קובץ זהה לטביעה
        if: steps.cf.outputs.up == 'yes'
        env:
          URL: ${{ vars.STAGING_URL || 'https://thesnowball.pages.dev' }}
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          for i in $(seq 1 20); do
            live=$(curl -sS --max-time 20 "${URL%/}/sw.js?n=$RANDOM$i" | grep -oP "portfolio-pwa-\Kv\d+" | head -1 || true)
            if [ "$live" = "$VER" ] && node tools/swgen.js --live "$URL"; then echo "הניסוי על $VER"; exit 0; fi
            echo "עדיין $live — מחכים ($i)"; sleep 15
          done
          echo "::error::סביבת הניסוי ($URL) לא הגיעה ל־$VER תוך 5 דקות"; exit 1

  approve:
    needs: staging
    if: needs.staging.outputs.release == 'yes'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-approve
      cancel-in-progress: true
    steps:
      - run: echo "אושר לפרודקשן — ${{ needs.staging.outputs.rel }} (${{ needs.staging.outputs.ver }}, $SHA)"

  deploy:
    needs: [staging, approve]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: הקומיט נמצא ב־main — ורק אז עוברים אליו
        run: |
          git merge-base --is-ancestor "$SHA" HEAD || { echo "::error::$SHA לא נמצא ב־main — לא פורסים"; exit 1; }
          git checkout -q --detach "$SHA"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .
      - id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  deploy-cf:
    needs: [staging, approve]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-cf-prod
      cancel-in-progress: false
    outputs:
      up: ${{ steps.cf.outputs.up }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: הקומיט נמצא ב־main — ורק אז עוברים אליו
        run: |
          git merge-base --is-ancestor "$SHA" HEAD || { echo "::error::$SHA לא נמצא ב־main — לא פורסים"; exit 1; }
          git checkout -q --detach "$SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: העלאה לייצור (Cloudflare Pages ‏thesnowball-prod)
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          REL: ${{ needs.staging.outputs.rel }}
          VER: ${{ needs.staging.outputs.ver }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "אין CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID — מדלגים"; exit 0; fi
          W="npx --yes wrangler@4.140.0"
          site="$RUNNER_TEMP/site"; mkdir -p "$site"
          git archive "$SHA" | tar -x -C "$site"; rm -rf "$site/.github"
          # הפרויקט נוצר ידנית (14/10/2026, עם הכתובות) — לא יוצרים כאן: שם שגוי = פרויקט ריק בלי כתובות
          $W pages project list | grep -q ' thesnowball-prod ' || { echo "::error::אין פרויקט thesnowball-prod ב־Cloudflare"; exit 1; }
          $W pages deploy "$site" --project-name thesnowball-prod --branch main --commit-hash "$SHA" --commit-message "$REL ($VER)" --commit-dirty=true
          echo "up=yes" >> "$GITHUB_OUTPUT"

  verify-and-tag:
    needs: [staging, deploy, deploy-cf]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write   # רק בשביל התגית
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: הקומיט נמצא ב־main — ורק אז עוברים אליו
        run: |
          git merge-base --is-ancestor "$SHA" HEAD || { echo "::error::$SHA לא נמצא ב־main — לא פורסים"; exit 1; }
          git checkout -q --detach "$SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: האתר החי מגיש את הגרסה, וכל קובץ זהה לטביעה
        env:
          VER: ${{ needs.staging.outputs.ver }}
        run: |
          for i in $(seq 1 30); do
            live=$(curl -sS --max-time 20 "https://yishaiguedj1.github.io/portfolio-pwa/sw.js?n=$RANDOM$i" | grep -oP "portfolio-pwa-\Kv\d+" | head -1 || true)
            if [ "$live" = "$VER" ] && node tools/swgen.js --live https://yishaiguedj1.github.io/portfolio-pwa/; then echo "האתר החי על $VER"; exit 0; fi
            echo "עדיין $live — מחכים ($i)"; sleep 30
          done
          echo "::error::האתר החי לא הגיע ל־$VER תוך 15 דקות"; exit 1
      - name: הכתובות של thesnowball.app מגישות את הגרסה, וכל קובץ זהה לטביעה
        if: needs.deploy-cf.outputs.up == 'yes'
        env:
          VER: ${{ needs.staging.outputs.ver }}
        run: |
          # Invest — כל קובץ מול הטביעה; Academy ו־Studio — אותו פרויקט: הגרסה + הדף שבשורש (academy.html / studio.html)
          for u in https://invest.thesnowball.app/ https://academy.thesnowball.app/ https://studio.thesnowball.app/; do
            ok=
            for i in $(seq 1 20); do
              live=$(curl -sS --max-time 20 "${u}sw.js?n=$RANDOM$i" | grep -oP "portfolio-pwa-\Kv\d+" | head -1 || true)
              if [ "$live" = "$VER" ]; then
                case "$u" in
                  *//invest.*) node tools/swgen.js --live "$u" && ok=1 ;;
                  *) node tools/swgen.js --live-root "$u" && ok=1 ;;
                esac
              fi
              [ -n "$ok" ] && { echo "$u על $VER"; break; }
              echo "$u עדיין $live — מחכים ($i)"; sleep 15
            done
            [ -n "$ok" ] || { echo "::error::$u לא הגיע ל־$VER תוך 5 דקות"; exit 1; }
          done
          loc=$(curl -sS -o /dev/null -w '%{redirect_url}' --max-time 20 https://thesnowball.app/)
          [ "$loc" = "https://invest.thesnowball.app/" ] || { echo "::error::thesnowball.app לא מעביר ל־Invest ($loc)"; exit 1; }
      - name: תגית לגרסת המערכת
        env:
          TAG: v${{ needs.staging.outputs.rel }}
          VER: ${{ needs.staging.outputs.ver }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then echo "התגית $TAG כבר קיימת"; exit 0; fi
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com tag -a "$TAG" "$SHA" -m "$TAG (בנייה $VER)"
          git push origin "refs/tags/$TAG"
          echo "נוספה תגית $TAG (בנייה $VER)"
